<form [formGroup]="signInForm" (ngSubmit)="handleSignIn()">
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Your email address">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Your password">
    </div>
  
    <button type="submit" [disabled]="signInForm.invalid">
      Sign In
    </button>
  
    <button type="button" (click)="handleSignUp()" [disabled]="signInForm.invalid">
      Sign Up
    </button>
  </form>
